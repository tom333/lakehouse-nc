[project]
name = "lakehouse-nc"
version = "0.1.0"
description = "Lakehouse ouvert de la Nouvelle-Calédonie et agent texte-vers-SQL"
requires-python = ">=3.12"
# Dépendances de l'agent seul (installé par le portfolio).
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "plotly>=7.1.0",
    "sqlglot>=30.31.0",
    "trino>=0.340.0",
]

[project.optional-dependencies]
# Ingestion, transformations et orchestration (image Dagster).
pipeline = [
    "dagster==1.13.30",
    "dagster-dbt>=0.29.30",
    "dagster-dlt>=0.29.30",
    "dagster-k8s>=0.29.30",
    "dagster-postgres==0.29.30",
    "dbt-trino>=1.12.0",
    "dlt[pyiceberg,s3]>=1.32.0",
]

[dependency-groups]
dev = [
    "dagster-webserver==1.13.30",
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
