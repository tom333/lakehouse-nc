[[question]]
id = "q39"
question = "Donne le nombre de ventes de véhicules d'occasion en 2025 par province de l'acquéreur."
sql = "SELECT c.province, count(*) FROM fct_transferts t JOIN dim_commune c ON c.commune = t.commune WHERE year(date_transaction) = 2025 GROUP BY 1"

[[question]]
id = "q40"
question = "Combien de ventes de véhicules d'occasion ont eu lieu un samedi en 2025 ?"
sql = "SELECT count(*) FROM fct_transferts WHERE year(date_transaction) = 2025 AND day_of_week(date_transaction) = 6"

[[question]]
id = "q41"
question = "Quel jour de la semaine compte le plus de ventes de véhicules d'occasion, toutes années confondues, et combien ?"
sql = "SELECT d.libelle_jour, count(*) n FROM fct_transferts t JOIN dim_date d ON d.date_jour = t.date_transaction GROUP BY 1 ORDER BY n DESC LIMIT 1"

[[question]]
id = "q42"
