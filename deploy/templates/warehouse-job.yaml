# Amorce Lakekeeper et aligne le warehouse Iceberg sur ces valeurs après chaque
# synchronisation : création s'il n'existe pas, sinon mise à jour du stockage.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-warehouse
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: warehouse
          image: python:3.13-alpine
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakehouse-nc-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lakehouse-nc-secrets
                  key: s3-secret-key
          command: ["python", "-c"]
          args:
            - |
              import json, os, time, urllib.error, urllib.request

              BASE = "http://lakekeeper.{{ .Release.Namespace }}.svc.cluster.local:8181"
              API = BASE + "/management/v1"

              def appel(methode, chemin, corps=None):
                  req = urllib.request.Request(
                      API + chemin, method=methode,
                      data=None if corps is None else json.dumps(corps).encode(),
                      headers={"Content-Type": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req) as r:
                          texte = r.read()
                          return r.status, json.loads(texte) if texte else None
                  except urllib.error.HTTPError as e:
                      return e.code, e.read().decode()

              while True:
                  try:
                      urllib.request.urlopen(BASE + "/health")
                      break
                  except OSError:
                      time.sleep(5)

              # 204 la première fois ; ensuite une erreur « déjà amorcé », sans conséquence.
              print("bootstrap", appel("POST", "/bootstrap", {"accept-terms-of-use": True})[0])

              stockage = {
                  "storage-profile": {
                      "type": "s3",
                      "bucket": "{{ .Values.warehouse.bucket }}",
                      "region": "{{ .Values.warehouse.region }}",
                      "endpoint": "{{ .Values.warehouse.s3Endpoint }}",
                      "path-style-access": True,
                      "sts-enabled": False,
                      "remote-signing-enabled": True,
                      "flavor": "s3-compat",
                  },
                  "storage-credential": {
                      "type": "s3",
                      "credential-type": "access-key",
                      "aws-access-key-id": os.environ["S3_ACCESS_KEY"],
                      "aws-secret-access-key": os.environ["S3_SECRET_KEY"],
                  },
              }
              nom = "{{ .Values.warehouse.name }}"
              code, rep = appel("POST", "/warehouse", {
                  "warehouse-name": nom, "delete-profile": {"type": "hard"}, **stockage,
              })
              print("création", code)
              if code == 409:
                  _, liste = appel("GET", "/warehouse")
                  wid = next(w["id"] for w in liste["warehouses"] if w["name"] == nom)
                  code, rep = appel("POST", f"/warehouse/{wid}/storage", stockage)
                  print("mise à jour du stockage", code)
              if code >= 300:
                  raise SystemExit(f"échec {code} : {rep}")
