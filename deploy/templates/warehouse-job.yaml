# Amorce Lakekeeper et crée le warehouse Iceberg après chaque synchronisation.
# Idempotent : bootstrap déjà fait et warehouse existant (409) sont acceptés.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-warehouse
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: warehouse
          image: curlimages/curl:8.17.0
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: lakehouse-nc-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: lakehouse-nc-secrets
                  key: s3-secret-key
          command: ["/bin/sh", "-ec"]
          args:
            - |
              API=http://lakekeeper.{{ .Release.Namespace }}.svc.cluster.local:8181/management/v1
              until curl -sf "http://lakekeeper.{{ .Release.Namespace }}.svc.cluster.local:8181/health"; do sleep 5; done
              # Bootstrap : 204 la première fois, erreur ensuite (déjà amorcé), sans conséquence.
              curl -s -o /dev/null -w "bootstrap %{http_code}\n" -X POST "$API/bootstrap" \
                -H 'Content-Type: application/json' -d '{"accept-terms-of-use": true}'
              code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST "$API/warehouse" \
                -H 'Content-Type: application/json' -d @- <<EOF
              {
                "warehouse-name": "{{ .Values.warehouse.name }}",
                "storage-credential": {
                  "type": "s3",
                  "credential-type": "access-key",
                  "aws-access-key-id": "$S3_ACCESS_KEY",
                  "aws-secret-access-key": "$S3_SECRET_KEY"
                },
                "storage-profile": {
                  "type": "s3",
                  "bucket": "{{ .Values.warehouse.bucket }}",
                  "region": "{{ .Values.warehouse.region }}",
                  "endpoint": "{{ .Values.warehouse.s3Endpoint }}",
                  "path-style-access": true,
                  "sts-enabled": false,
                  "remote-signing-enabled": true,
                  "flavor": "s3-compat"
                },
                "delete-profile": {"type": "hard"}
              }
              EOF
              )
              echo "warehouse $code"
              [ "$code" = 201 ] || [ "$code" = 409 ] || { cat /tmp/out; exit 1; }
